<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I.T.TREY</title>
<meta name="description" content="I.T.TREY — website, socials, and contact in one place.">
<meta name="theme-color" content="#05070f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root {
    --bg: #05070f;
    --card: #0c1224;
    --line: #1c2a55;
    --blue: #4169e1;
    --blue-hi: #5b82ff;
    --text: #f2f5ff;
    --muted: #9aa6c8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 60% at 50% 0%, #10204f 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4;
    display: flex;
    justify-content: center;
    padding: 40px 16px 32px;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

  .avatar {
    width: 240px; max-width: 70vw; height: auto;
    filter: drop-shadow(0 10px 30px rgba(65,105,225,.45));
  }
  h1 { margin-top: 18px; font-size: 2rem; letter-spacing: .12em; font-weight: 800; }
  /* EDIT YOUR TAGLINE in the <p class="tagline"> below */
  .tagline { margin-top: 6px; color: var(--muted); text-align: center; font-size: 1rem; }

  .links { width: 100%; margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 60px; padding: 14px 18px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    font-size: 1.08rem; font-weight: 600;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--blue); background: #101a38; outline: none; }
  .btn:active { transform: scale(.98); }
  .btn .ico {
    flex: none; width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: rgba(65,105,225,.16); color: var(--blue-hi);
  }
  .btn .ico svg { width: 20px; height: 20px; }
  .btn .label { flex: 1; }
  .btn .arrow { color: var(--muted); font-size: 1.2rem; }
  .btn.primary { background: var(--blue); border-color: var(--blue); }
  .btn.primary:hover, .btn.primary:focus-visible { background: var(--blue-hi); border-color: var(--blue-hi); }
  .btn.primary .ico { background: rgba(255,255,255,.18); color: #fff; }
  .btn.primary .arrow { color: #fff; }

  .qr { margin-top: 36px; text-align: center; }
  .qr img {
    width: 180px; height: 180px; display: block; margin: 0 auto;
    background: #fff; padding: 10px; border-radius: 14px;
    border: 3px solid var(--blue);
  }
  .qr p { margin-top: 10px; color: var(--muted); font-size: .95rem; }
  .qr a { color: var(--blue-hi); font-size: .9rem; }
  footer { margin-top: 28px; color: #5d6890; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <img class="avatar" src="profile.png" alt="Tech On I.T.Trey badge" width="480" height="548">
  <h1>I.T.TREY</h1>
  <p class="tagline">Your one-line tagline goes here</p>

  <nav class="links">
    <a class="btn" href="https://www.instagram.com/i.t.trey/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
      <span class="label">Instagram</span><span class="arrow">›</span>
    </a>

    <a class="btn" href="https://discord.gg/4s7GAxWVhF" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 12.2 0l.5.4a12.8 12.8 0 0 1-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg></span>
      <span class="label">Discord</span><span class="arrow">›</span>
    </a>

    <a class="btn" href="https://links.humaios.com/widget/form/GGeuWoW1LHnL3R20EXbY" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
      <span class="label">Contact Me</span><span class="arrow">›</span>
    </a>

    <a class="btn primary" href="contact.vcf" download="contact.vcf">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span>
      <span class="label">Save Contact</span><span class="arrow">↓</span>
    </a>
  </nav>

  <section class="qr">
    <img src="qr.png" alt="QR code linking to ittrey.tech" width="180" height="180">
    <p>Scan to open this card</p>
    <a href="qr.png" download="ittrey-card-qr.png">Download QR code</a>
  </section>

  <footer>© I.T.TREY</footer>
</main>
</body>
</html>
